<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090a0d"><title>My Garage</title><link rel="stylesheet" href="garage.css"></head><body><div class="app"><header class="topbar"><div><div class="eyebrow">MY GARAGE</div><h1>Мій гараж</h1></div><button id="addCar" class="icon-btn">＋</button></header><main><section class="hero"><div><span class="eyebrow">ВСІ АВТО</span><strong id="carCount">0</strong><span>автомобілів</span></div><div class="hero-stat"><span>ВИТРАТИ</span><strong id="totalCost">0 ₴</strong></div></section><div id="cars" class="cars"></div><section id="empty" class="empty hidden"><div class="empty-icon">🚗</div><h2>Гараж поки порожній</h2><p>Додай свою машину і почни вести історію обслуговування.</p><button class="primary" id="addCarEmpty">Додати автомобіль</button></section></main></div><dialog id="carDialog"><form method="dialog" id="carForm" class="dialog"><button type="button" class="close" id="closeCar">×</button><div class="eyebrow">НОВИЙ АВТОМОБІЛЬ</div><h2>Додати машину</h2><label>Назва<input name="name" placeholder="Peugeot 206" required></label><div class="grid2"><label>Рік<input name="year" type="number"></label><label>Пробіг, км<input name="mileage" type="number"></label></div><div class="grid2"><label>Двигун<input name="engine" placeholder="1.4 бензин"></label><label>Коробка<input name="gearbox" placeholder="АКПП"></label></div><label>Власник<input name="owner" placeholder="Я / Папа"></label><label>VIN<input name="vin" placeholder="VF3XXXXXXXXXXXXXXX" maxlength="17"></label><label>Держномер<input name="plate" placeholder="AA1234AA"></label><label>Фото авто<input name="photo" type="url" placeholder="https://..."></label><button class="primary" value="save">Зберегти</button></form></dialog><dialog id="editCarDialog"><form method="dialog" id="editCarForm" class="dialog"><button type="button" class="close" id="closeEditCar">×</button><div class="eyebrow">АВТОМОБІЛЬ</div><h2>Редагувати авто</h2><label>Назва<input name="name" required></label><div class="grid2"><label>Рік<input name="year" type="number"></label><label>Пробіг, км<input name="mileage" type="number"></label></div><div class="grid2"><label>Двигун<input name="engine"></label><label>Коробка<input name="gearbox"></label></div><label>Власник<input name="owner"></label><label>VIN<input name="vin" maxlength="17"></label><label>Держномер<input name="plate"></label><label>Фото авто<input name="photo" type="url"></label><button class="primary" value="save">Зберегти зміни</button><button type="button" class="danger" id="deleteCar">Видалити автомобіль</button></form></dialog><dialog id="carViewDialog"><div class="dialog"><button type="button" class="close" id="closeView">×</button><div id="carView"></div></div></dialog><dialog id="workDialog"><form method="dialog" id="workForm" class="dialog"><button type="button" class="close" id="closeWork">×</button><div class="eyebrow">ОБСЛУГОВУВАННЯ</div><h2 id="workDialogTitle">Додати роботу</h2><label>Що зробили?<input name="title" required placeholder="Заміна масла та фільтрів"></label><div class="grid2"><label>Дата<input name="date" type="date"></label><label>Пробіг, км<input name="mileage" type="number" required></label></div><label>Запчастини<input name="parts" placeholder="Масло, фільтр, колодки…"></label><label>Вартість, ₴<input name="cost" type="number" min="0" step="0.01"></label><label>Нотатки<textarea name="note" placeholder="Що саме зробили, які деталі встановили…"></textarea></label><button class="primary" value="save">Зберегти роботу</button></form></dialog><script src="garage.js"></script></body></html>
